services:
  postgres:
    image: postgres:16-alpine
    container_name: minenet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: minenet
      POSTGRES_PASSWORD: minenet_dev_password
      POSTGRES_DB: minenet
    ports:
      - "5432:5432"
    volumes:
      - minenet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minenet -d minenet"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: minenet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - minenet_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  minenet_pgdata:
  minenet_redisdata:
