[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.34"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

# Fast local iteration: FOUNDRY_PROFILE=dev forge test  (~3 min instead of ~50 with the optimizer)
[profile.dev]
optimizer = false

# CI: a deeper fuzzing budget (solskill: fuzz/invariant runs with a real time budget)
[profile.ci.fuzz]
runs = 4096

[profile.ci.invariant]
runs = 512
depth = 128
fail_on_revert = false

[lint]
lint_on_build = false

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }
base = { key = "${BASESCAN_API_KEY}", chain = 8453 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
